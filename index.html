<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>GSAP Image Slider</title>

        <link rel="stylesheet" href="./assets/css/style.css" />
    </head>

    <body>
        <main class="slider">
            <!-- MAIN IMAGES -->
            <div class="slider-images">
                <div class="slide" data-index="0">
                    <div class="image-inner">
                        <img src="./assets/images/img1.jpg" alt="" />
                    </div>
                </div>

                <div class="slide" data-index="1">
                    <div class="image-inner">
                        <img src="./assets/images/img2.jpg" alt="" />
                    </div>
                </div>

                <div class="slide" data-index="2">
                    <div class="image-inner">
                        <img src="./assets/images/img3.jpg" alt="" />
                    </div>
                </div>

                <div class="slide" data-index="3">
                    <div class="image-inner">
                        <img src="./assets/images/img4.jpg" alt="" />
                    </div>
                </div>

                <div class="slide" data-index="4">
                    <div class="image-inner">
                        <img src="./assets/images/img5.jpg" alt="" />
                    </div>
                </div>
            </div>

            <!-- MINIMAP -->
            <div class="minimap">
                <div class="minimap-track">
                    <div class="mini-slide" data-mini-index="0">
                        <img src="./assets/images/img1.jpg" alt="" />
                    </div>

                    <div class="mini-slide" data-mini-index="1">
                        <img src="./assets/images/img2.jpg" alt="" />
                    </div>

                    <div class="mini-slide" data-mini-index="2">
                        <img src="./assets/images/img3.jpg" alt="" />
                    </div>

                    <div class="mini-slide" data-mini-index="3">
                        <img src="./assets/images/img4.jpg" alt="" />
                    </div>

                    <div class="mini-slide" data-mini-index="4">
                        <img src="./assets/images/img5.jpg" alt="" />
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

        <script src="./assets/js/main.js"></script>
    </body>
</html>
